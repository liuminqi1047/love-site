server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /var/www/love;
    index index.php index.html;

    charset utf-8;
    server_tokens off;

    # 后台保存照片走 JSON + base64（上限 3MB），base64 会膨胀，必须显式放大；
    # 完整备份包恢复也要整包上传（data+照片+音乐，约 12MB），留到 64m。
    client_max_body_size 64m;

    access_log /var/log/nginx/love.access.log;
    error_log  /var/log/nginx/love.error.log;

    # ---------- 门禁：这些目录只能被 PHP require，绝不能直接下载 ----------
    location ^~ /data/   { deny all; }
    location ^~ /lib/    { deny all; }
    location ^~ /deploy/ { deny all; }

    # 上传照片只允许走 /photo.php 代理
    location ^~ /assets/img/uploads/ { deny all; }
    location ~* ^/assets/img/[^/]+\.(jpe?g|png|webp|gif)$ { deny all; }

    # 构建用的片段（tools/build.py 读它），不对外
    location ^~ /partials/ { deny all; }

    # 分享封面：必须能被公网抓取，但上面那条"img 下 png/jpg 一律禁止"会挡住它，
    # 所以用精确匹配单独放行（精确匹配优先级最高，其余图片仍然禁止直取）
    location = /assets/img/og-cover.png { try_files $uri =404; }

    # 点文件（.htaccess/.git/.env），放行 .well-known
    location ~* /\.(?!well-known/) { deny all; }

    # ---------- PHP ----------
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        # 还原被边缘层改写的 Host，并告知 PHP 真实协议（见 conf.d/love-realhost.conf）
        fastcgi_param HTTP_HOST $love_real_host;
        fastcgi_param HTTPS $love_https;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 120;
    }

    # ---------- 静态资源长缓存（构建时已带 ?v=） ----------
    location ~* ^/assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---------- HTML 不缓存，保证后台改完即时生效 ----------
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
