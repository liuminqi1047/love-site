# 平台边缘层会把 Host 改写成上游地址（实测 HTTP_HOST=127.0.0.1），
# 真实域名只在 X-Forwarded-Host 里。这里还原成真实 Host 再传给 PHP，
# 否则应用的「同源校验」永远不通过（表现为输对密码也进不去）。
map $http_x_forwarded_host $love_real_host {
    default $http_x_forwarded_host;
    ""      $host;
}
map $http_x_forwarded_proto $love_https {
    default "";
    https   "on";
}
