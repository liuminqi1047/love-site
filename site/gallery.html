  <!-- 悬浮音乐播放器：胶囊只放最常用的四个键，点 ☰ 向上弹出列表面板 -->
  <div class="mp" id="musicPlayer" role="group" aria-label="音乐播放器">
    <button class="mp-btn" id="mpPrev" aria-label="上一首" title="上一首">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.6" y="5" width="2.6" height="14" rx="1.3"/><path d="M19.4 5.9v12.2c0 .9-1 1.4-1.7.9l-7.4-6.1a1.2 1.2 0 0 1 0-1.8l7.4-6.1c.7-.5 1.7 0 1.7.9z"/></svg>
    </button>
    <button class="mp-btn mp-main" id="musicBtn" aria-label="播放或暂停" title="播放">
      <span id="musicIcon" aria-hidden="true">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8.2 5.3v13.4c0 1 1.1 1.6 1.9 1.1l9.4-6.7a1.3 1.3 0 0 0 0-2.2L10.1 4.2c-.8-.5-1.9.1-1.9 1.1z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><rect x="6.6" y="5" width="3.9" height="14" rx="1.4"/><rect x="13.5" y="5" width="3.9" height="14" rx="1.4"/></svg>
      </span>
    </button>
    <button class="mp-btn" id="mpNext" aria-label="下一首" title="下一首">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 5.9v12.2c0 .9 1 1.4 1.7.9l7.4-6.1a1.2 1.2 0 0 0 0-1.8L6.3 5c-.7-.5-1.7 0-1.7.9z"/><rect x="16.8" y="5" width="2.6" height="14" rx="1.3"/></svg>
    </button>
    <button class="mp-btn" id="mpList" aria-label="播放列表" title="播放列表" aria-expanded="false" aria-controls="mpPanel" aria-haspopup="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="2.2" rx="1.1"/><rect x="4" y="11" width="16" height="2.2" rx="1.1"/><rect x="4" y="16" width="10" height="2.2" rx="1.1"/></svg>
    </button>
  </div>

  <div class="mp-panel glass" id="mpPanel" role="dialog" aria-label="播放列表" hidden>
    <div class="mp-head">
      <span class="mp-now" id="mpTitle">未在播放</span>
      <button class="mp-mode" id="mpMode" title="切换播放模式">顺序播放</button>
    </div>
    <div class="mp-progress" id="mpBar" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" title="点击跳转"><div class="mp-fill" id="mpFill"></div></div>
    <div class="mp-times"><span id="mpCur">0:00</span><span id="mpDur">0:00</span></div>
    <div class="mp-list" id="mpListBody"></div>
  </div>
  <button id="topBtn" aria-label="返回顶部">↑</button>
